name: Audit external website

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run type"
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - intelligent
      site:
        description: "Site file name without .json, or 'all'. Only 'all' updates the dashboard."
        required: true
        type: string
        default: all
  # Deterministic only, and off until the repository variable GUARDIAN_SCHEDULED_SMOKE is 'true'.
  # Claude-powered audits run only by manual dispatch.
  schedule:
    - cron: '37 5 * * *' # daily baseline, UTC

# Each job below asks for only what it needs.
permissions: {}

concurrency:
  group: site-guardian-production
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: '2.1.319'

jobs:
  audit:
    if: ${{ github.event_name != 'schedule' || vars.GUARDIAN_SCHEDULED_SMOKE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      completed: ${{ steps.audit.outputs.completed }}
      publish: ${{ steps.audit.outputs.publish }}
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'smoke' }}
      SITE: ${{ inputs.site || 'all' }}
    steps:
      - name: Check out the agent (never the target website's source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies without running package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Restore learning memory
        id: state
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: guardian-state
          path: .state
          persist-credentials: false

      - name: Copy learning memory into place
        run: |
          mkdir -p memory
          if [ -d .state/memory ]; then cp .state/memory/*.json memory/ 2>/dev/null || true; fi

      - name: Check for a Claude subscription token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install Claude Code
        if: env.MODE == 'intelligent' && steps.token.outputs.present == 'true'
        run: npm install -g --no-audit --no-fund "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      # The token exists only in this step. Without it, the audit still runs and reports the limitation.
      - name: Run the read-only browser audit
        id: audit
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.MODE == 'intelligent' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          set +e
          node src/cli.mjs --mode "$MODE" --site "$SITE"
          code=$?
          # Runs while the token is present, so an exact match would be caught. Reports only file names.
          if ! node scripts/scan-public-output.mjs out memory; then
            rm -rf out memory
            echo "exit_code=70" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ -f out/summary.json ]; then echo "completed=true" >> "$GITHUB_OUTPUT"; fi
          if [ -f out/summary.json ] && [ "$SITE" = "all" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; fi

      - name: Upload full evidence, including browser traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guardian-${{ github.run_number }}
          path: |
            out/
            !out/**/trace-*.zip
          retention-days: 14
          if-no-files-found: warn

      - name: Upload learning memory for the persist job
        if: steps.audit.outputs.completed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guardian-memory-${{ github.run_number }}
          path: memory/*.json
          retention-days: 3

      - name: Package the dashboard
        if: steps.audit.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/site

      # Last on purpose: evidence and memory are saved before the run can go red.
      - name: Fail the run if the agent failed or a site is down
        if: steps.audit.outputs.completed == 'true' || steps.audit.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::The audit agent did not complete. See the evidence artifact."
            exit 1
          fi
          blocked="$(jq '.blockedBySite' out/summary.json)"
          if [ "$blocked" != "0" ]; then
            echo "::error::The site's bot protection refused this runner, so no valid audit took place. Allow the agent in the site's protection settings."
            exit 1
          fi
          blockers="$(jq '.blockers' out/summary.json)"
          if [ "$blockers" != "0" ]; then
            echo "::error::$blockers blocking issue(s) found. See the dashboard."
            exit 1
          fi

  # Receives only JSON files, cleans them, and never runs the browser or third-party packages.
  persist-memory:
    needs: audit
    if: ${{ !cancelled() && needs.audit.outputs.completed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Download learning memory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guardian-memory-${{ github.run_number }}
          path: .incoming

      - name: Validate and commit learning memory
        run: |
          set -euo pipefail
          node scripts/sanitize-memory.mjs .incoming .clean
          git config user.name "site-quality-guardian[bot]"
          git config user.email "site-quality-guardian[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin guardian-state >/dev/null 2>&1; then
            git fetch --depth=1 origin guardian-state
            git worktree add -B guardian-state .state FETCH_HEAD
          else
            git worktree add --detach .state
            git -C .state checkout --orphan guardian-state
            git -C .state rm -rfq --ignore-unmatch .
          fi
          mkdir -p .state/memory
          rm -f .state/memory/state.json
          cp .clean/*.json .state/memory/
          git -C .state add memory
          if ! git -C .state diff --cached --quiet; then
            git -C .state commit -m "chore: persist audit coverage and findings history"
            git -C .state push origin HEAD:guardian-state
          fi

  deploy-dashboard:
    needs: audit
    if: ${{ !cancelled() && needs.audit.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy the dashboard
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
